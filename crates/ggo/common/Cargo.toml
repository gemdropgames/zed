[package]
name = "ggo_common"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ggo_common.rs"

[dependencies]
async-channel.workspace = true # GGO -- LinkEndpoint's inbound/tick channels
log.workspace = true
settings.workspace = true # GGO -- `bind_default_keymap` for panel tests
ggo-wire.workspace = true # GGO -- LinkEndpoint::send_app frames CHANNEL_APP
gpui.workspace = true
schemars.workspace = true # GGO -- the `ReimportTileset` Action derive
serde.workspace = true
image.workspace = true
path.workspace = true
project.workspace = true
# The child-process runner below (`run_capture`) -- `smol::process::Command`
# rather than `std`'s, because this checkout's `clippy.toml` disallows the
# latter's `output`/`spawn`/`status` outright.
smol.workspace = true
ui.workspace = true
workspace.workspace = true

[target.'cfg(unix)'.dependencies]
# GGO -- setpgid/killpg for the process-group cancel, see ProcessGroupGuard.
libc.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
