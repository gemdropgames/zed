[package]
name = "ggo_world_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ggo_world_panel.rs"

[dependencies]
gpui.workspace = true
image.workspace = true
project.workspace = true
serde_json.workspace = true
smallvec.workspace = true
ui.workspace = true
workspace.workspace = true
ggo-worldlib.workspace = true # GGO
# Crate-local path dep (not a workspace dep -- keeps this task free of
# upstream Cargo.toml edits): the RGB565<->RGB888 pixel helpers worldlib's
# own compose path uses; single source, no local copy.
ggo-asset-formats = { path = "../../../../ggo/sdk/ggo-asset-formats" } # GGO

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
