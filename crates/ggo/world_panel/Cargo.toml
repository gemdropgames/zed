[package]
name = "ggo_world_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ggo_world_panel.rs"

[features]
# Cross-crate test hooks (`WorldPanel::test_root_override` /
# `test_dirty_open_world`). `ggo_emu_panel`'s "Emulate this world saves
# first" tests need a genuinely dirty document in a REAL directory, and
# both the root override and the edit path are crate-private -- the same
# reason `project`/`workspace` carry a `test-support` feature upstream.
test-support = []

[dependencies]
anyhow.workspace = true
editor.workspace = true
gpui.workspace = true
log.workspace = true
project.workspace = true
serde_json.workspace = true
smol.workspace = true
toml.workspace = true
ui.workspace = true
workspace.workspace = true
ggo-worldlib.workspace = true # GGO
ggo-asset-formats.workspace = true # GGO
ggo-audio.workspace = true # GGO -- the audio budget line sizes stems against the 384 KiB sample region
ggo_common.workspace = true
emerald-editor-link.workspace = true # GGO -- the host half of the editor link (and `EntityRow`, which it re-exports)
emerald-world.workspace = true # GGO -- encode_toml_at for the live world blob
# GGO -- wired ahead of its first use (the layers rail lands before the
# painting does): world-hosted map editing paints a background layer with
# `ggo_map_panel`'s own `PaintSession`/`MapTool` rather than growing a
# second copy of the painting engine here.
ggo_map_panel.workspace = true # GGO
[dev-dependencies]
# Test-only: decodes what the panel put on the viewer link back into APP
# payloads, the same reader the emu panel runs over the cart's TX.
ggo-comm.workspace = true # GGO
# Test-only: the wire codec both halves of the link share, so the gesture
# tests assert on DECODED host messages instead of on byte offsets. A
# dev-dep, so the crate's own build still depends on nothing but
# `emerald-editor-link` for the host side.
emerald-editor-runtime.workspace = true # GGO
# The map panel's own read-back hooks are `test-support`-gated over there,
# exactly as this crate gates its own; the world panel's painting tests
# will read cells back through them.
ggo_map_panel = { workspace = true, features = ["test-support"] } # GGO
# Test-only: the asset jump goes through the path-open interceptor
# registry, so the sprite panel's `init` is what makes a `.spr` land in a
# sprite tab in the jump test. The panel itself has no sprite-panel dep.
ggo_sprite_panel.workspace = true # GGO
# `project`'s test-support turns on `remote/test-support`, which adds a
# `RemoteConnectionOptions` variant that `remote_connection`'s lib only
# matches on under ITS `test-support` -- same dance `ggo_emu_panel`'s
# dev-deps document.
remote_connection = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
path = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
