[package]
name = "ggo_daemon_client"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ggo_daemon_client.rs"

[features]
# An in-process daemon for panel tests: real report/fault/ingest answers,
# served out of a throwaway database, with no `ggo serve` anywhere. Turning
# it on pulls in worldlib's `db`, which is why it is a feature and not the
# default -- the production build must never link sqlx.
test-support = ["ggo-worldlib/db", "dep:ggo-audio"]

# The ONE crate under `crates/ggo/` allowed a dependency on a `ggo-*` crate
# (see `docs/daemon-api-plan.md` §5 in the GGO repo). Every other panel
# reaches GemdropGo through this client. P6 adds a test that enforces it.
#
[dependencies]
# The report row types, re-exported from here. Default features ONLY: the
# `db` feature is what drags in sqlx and a connection pool, and the whole
# point of this crate is that the editor no longer opens a database.
# `ggo-shm` joins it with P4's frame ring.
ggo-worldlib.workspace = true
# The in-process daemon's audio arms run the REAL codec, so a panel test
# bakes what the daemon would bake. Optional: only `test-support` needs it,
# and the production client carries no codec at all.
ggo-audio = { workspace = true, optional = true }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# `smol::process::Command`, not `std`'s: this checkout's `clippy.toml`
# disallows the latter's `spawn`/`output`/`status` outright.
smol.workspace = true

[dev-dependencies]
tempfile.workspace = true
