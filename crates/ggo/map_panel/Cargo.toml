[package]
name = "ggo_map_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
# Cross-crate test hooks: `ggo_smoke`'s map journeys drive the panel
# through the tab the open interceptor creates, and every field they read
# (the store's cells, the canvas bounds, the cell selection) is
# crate-private -- the same reason `ggo_world_panel`/`ggo_sprite_panel`
# carry this feature. Read-only hooks only.
test-support = []

[lib]
path = "src/ggo_map_panel.rs"

[dependencies]
anyhow.workspace = true
editor.workspace = true
gpui.workspace = true
log.workspace = true
project.workspace = true
project_panel.workspace = true
ui.workspace = true
workspace.workspace = true
ggo-asset-formats.workspace = true # GGO
ggo-worldlib.workspace = true # GGO
ggo_common.workspace = true

[dev-dependencies]
project_panel = { workspace = true, features = ["test-support"] }
# `project`'s test-support turns on `remote/test-support`, which adds a
# `RemoteConnectionOptions` variant that `remote_connection`'s lib only
# matches on under ITS `test-support` -- same dance `ggo_emu_panel`'s
# dev-deps document.
remote_connection = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
path = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
