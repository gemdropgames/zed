[package]
name = "ggo_map_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
# Cross-crate test hooks on the shared widgets: a host's tests type into
# `paint_ui::ResizeFields`' editor entities, which are otherwise private.
# Read-only hooks only.
test-support = []

[lib]
path = "src/ggo_map_panel.rs"

# This crate is a LIBRARY, not a panel (the standalone map editor was
# retired -- see the lib doc), so its dependency list is the paint
# surface's own: gpui + ui + editor for the shared widgets, worldlib for
# the document. Nothing here touches `workspace`, `project` or
# `project_panel` any more -- a host owns the tab, the worktree and the
# context menu.
[dependencies]
editor.workspace = true
gpui.workspace = true
ui.workspace = true
ggo-asset-formats.workspace = true # GGO
ggo-worldlib.workspace = true # GGO
ggo_common.workspace = true

[dev-dependencies]
tempfile.workspace = true
