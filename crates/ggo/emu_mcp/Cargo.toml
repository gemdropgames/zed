[package]
name = "ggo_emu_mcp"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[[bin]]
name = "zedgg-emu-mcp"
path = "src/main.rs"

[dependencies]
base64.workspace = true
# Resolving the one shared database url (`ggo_db::url`), and -- in tests --
# seeding a throwaway database on the real schema through `ggo_db::TestDb`.
ggo-db.workspace = true
ggo_emu_remote.workspace = true
# `fetch_ggo_report`'s reads of the ggo database -- the same query fns the
# charts panel uses, so the tool and the Reports page can never disagree
# about a run.
ggo-worldlib.workspace = true
image.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
