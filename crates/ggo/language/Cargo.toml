[package]
name = "ggo_language"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ggo_language.rs"

[dependencies]
anyhow.workspace = true
language.workspace = true
toml.workspace = true
# The maintained successor of the grammar Zed's own TOML extension pins
# (zed-extensions/toml pins tree-sitter/tree-sitter-toml, archived Feb
# 2024; this is tree-sitter-grammars/tree-sitter-toml, published as
# `-ng`). The fork has no vendored TOML grammar of its own -- upstream
# extracted TOML into an extension in d074586fbf -- so this crate carries
# the dependency.
tree-sitter-toml-ng.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
settings_json.workspace = true
serde_json.workspace = true
syntax_theme = { workspace = true, features = ["test-support"] }
util.workspace = true
