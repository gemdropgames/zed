[package]
name = "ggo_language"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ggo_language.rs"

[dependencies]
anyhow.workspace = true
language.workspace = true
toml.workspace = true
# Same grammar Zed's own TOML extension uses (zed-extensions/toml pins
# tree-sitter-grammars/tree-sitter-toml, published as `-ng`). The fork has
# no vendored TOML grammar of its own -- upstream extracted TOML into an
# extension in d074586fbf -- so this crate carries the dependency.
tree-sitter-toml-ng.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
syntax_theme = { workspace = true, features = ["test-support"] }
util.workspace = true
