version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ggo_emu_wasm.rs"

[features]
test-support = ["dep:ggo-emu-core"]

[dependencies]
anyhow.workspace = true
fs.workspace = true
futures.workspace = true
ggo-emu-abi.workspace = true
gpui.workspace = true
http_client.workspace = true
log.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
util.workspace = true
wasmtime.workspace = true
ggo-emu-core = { workspace = true, optional = true } # GGO -- fixture carts only (header consts, crc32, syscall numbers)

[dev-dependencies]
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
ggo-emu-core.workspace = true
tempfile.workspace = true
