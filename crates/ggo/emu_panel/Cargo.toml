[package]
name = "ggo_emu_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
# Cross-crate test hooks: `ggo_smoke`'s emulator journeys drive the panel
# through the tab the open interceptor creates, and everything they read
# (the session, the frame counter, the delivered framebuffer, the status
# row) is private -- the same reason `ggo_map_panel`/`ggo_world_panel`
# carry this feature. It also re-exports `drive::fixture`, since there is
# no committed `.cart` in the fork for another crate to open.
test-support = []

[lib]
path = "src/ggo_emu_panel.rs"

[dependencies]
async-channel.workspace = true
chrono.workspace = true
# GGO -- R6's audio output. Already a workspace dependency (`crates/audio`,
# `livekit_client`, `settings_ui` all take it), and the same crate ggo-ide's
# `emu/audio.rs` and the standalone `ggo-emu` binary use, so the pane's
# stream is the one this project already knows how to reason about.
cpal.workspace = true
# GGO -- `Shared`, so every world tab of one emerald project waits on the
# same `emd editor-cart` build. See `viewer_run::shared_build`.
futures.workspace = true
ggo-comm.workspace = true # GGO -- MessageReader over the cart's comm TX
ggo-db.workspace = true # GGO -- the one PostgreSQL database: url, pool, schema/migrations, and the TestDb fixture
ggo-emu-core.workspace = true # GGO
ggo-wire.workspace = true # GGO -- channel consts; tests frame payloads
ggo_charts_panel.workspace = true # GGO -- S4's Re-run entry hands the run it just ingested to that panel
ggo_common.workspace = true # GGO -- the shared child-process runner, also with the charts/emerald panels
ggo_world_panel.workspace = true # GGO -- S4's "Emulate this world" saves that panel's doc and reuses its world-path rule
# GGO -- `diag_db::device_perf_run_id`: after a PASS, the flash looks up the
# perf run ggo-diag linked to the diag run it just recorded, so the reports
# tab can open on it. Same crate the charts panel's device-run rail reads.
ggo-worldlib.workspace = true
gpui.workspace = true
image.workspace = true
log.workspace = true # GGO -- R6: the cpal stream-error callback runs on a realtime audio thread, so it reports rather than panics
project.workspace = true
serde_json.workspace = true
smol.workspace = true # GGO -- `yield_now` between pumped frames, see `EmuPanel::run`
base64.workspace = true # GGO -- remote screenshot payloads, see `remote`
ggo_emu_remote.workspace = true # GGO -- agent remote-control protocol/registry
ui.workspace = true
util.workspace = true
workspace.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# GGO -- the USBDEVFS_CONNECT ioctl that reattaches the board's serial
# driver after a flash tool detached it, see `hardware::reattach_kernel_driver`.
libc.workspace = true

[dev-dependencies]
# The link tests stage cart -> host bytes the way `ggo-emu-core`'s own
# runtime tests do -- a real `COMM_SEND` ecall -- so they need the
# syscall number. Dev-only: nothing in the panel itself names the SDK.
gemdrop-sdk.workspace = true # GGO
# The save-first half of "Emulate this world" can only be exercised with a
# genuinely dirty world document in a real directory -- see that feature's
# comment in ggo_world_panel/Cargo.toml.
ggo_world_panel = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
path = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
# X4: the `.cart` routing test that enters at the REAL `project_panel`
# `Event::OpenedEntry` subscription rather than at
# `Workspace::intercept_path_open` -- the only test in the fork that would
# notice the GGO guard in `project_panel.rs` disappearing in a merge. Both
# are dev-only: no GGO test code lives in an upstream file, and neither
# crate is linked into the panel itself. `editor` is required for the
# control half (an unclaimed path must actually produce a tab).
editor.workspace = true
project_panel.workspace = true
# G1: the non-local half of the context-menu-contributor gate. A mock remote
# connection is the cheapest project whose `is_local()` is false; nothing
# else here talks to it. `release_channel` (+ `semver` for the version it
# takes) is what a `RemoteClient` reads out of the app globals on connect.
release_channel.workspace = true
remote = { workspace = true, features = ["test-support"] }
rpc.workspace = true
semver.workspace = true
# Not used by any test here: pure feature unification. `project/test-support`
# turns on `remote/test-support`, which adds a `RemoteConnectionOptions`
# variant that `remote_connection`'s lib only matches on under ITS
# `test-support`. Upstream's own `project_panel` dev-deps carry this exact
# line for the same reason.
remote_connection = { workspace = true, features = ["test-support"] }
