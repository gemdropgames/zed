[package]
name = "ggo_audio_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
# Cross-crate test hooks: `ggo_smoke`'s audio journey drives the panel
# through the tab the open interceptor creates, and everything it reads
# (the viewer state, the bake, the live preview, the loop flag) is
# crate-private -- the same reason `ggo_map_panel`/`ggo_world_panel` carry
# this feature. Read-only hooks only.
test-support = []

[lib]
path = "src/ggo_audio_panel.rs"

[dependencies]
anyhow.workspace = true
editor.workspace = true
ggo-asset-formats.workspace = true # GGO -- `parse_adp` for the Baked preview's blocks
# GGO -- `Decoded` and the ONE decode left here: the Source-mode preview
# feeds raw PCM to the `Apu`, and raw PCM is what `ggo_audio_probe`
# deliberately does not send. Bake/size/write went to the daemon in P3;
# this goes in P4 with the preview. See `docs/daemon-api-plan.md` §4.4.
ggo-audio.workspace = true
ggo-emu-core.workspace = true # GGO -- the standalone `Apu` behind the Baked preview
ggo_common.workspace = true
ggo_daemon_client.workspace = true # GGO -- probe / bake / size / write
ggo_emu_panel.workspace = true # GGO -- the cpal ring the emulator pane already owns
gpui.workspace = true
log.workspace = true
project.workspace = true
ui.workspace = true
workspace.workspace = true

[dev-dependencies]
# GGO -- the in-process daemon, so a panel test never needs `ggo serve`.
ggo_daemon_client = { workspace = true, features = ["test-support"] }
# `project`'s test-support turns on `remote/test-support`, which adds a
# `RemoteConnectionOptions` variant that `remote_connection`'s lib only
# matches on under ITS `test-support` -- same dance every GGO panel's
# dev-deps document.
remote_connection = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
path = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
