[package]
name = "ggo_audio_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ggo_audio_panel.rs"

[dependencies]
anyhow.workspace = true
editor.workspace = true
ggo-asset-formats.workspace = true # GGO -- `parse_adp` for the Baked preview's blocks
ggo-audio.workspace = true # GGO -- decode / bake / budget
ggo-emu-core.workspace = true # GGO -- the standalone `Apu` behind the Baked preview
ggo_common.workspace = true
ggo_emu_panel.workspace = true # GGO -- the cpal ring the emulator pane already owns
gpui.workspace = true
log.workspace = true
project.workspace = true
ui.workspace = true
workspace.workspace = true

[dev-dependencies]
# `project`'s test-support turns on `remote/test-support`, which adds a
# `RemoteConnectionOptions` variant that `remote_connection`'s lib only
# matches on under ITS `test-support` -- same dance every GGO panel's
# dev-deps document.
remote_connection = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
path = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
