[package]
name = "ggo_import_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
test-support = []

[lib]
path = "src/ggo_import_panel.rs"

[dependencies]
editor.workspace = true
gpui.workspace = true
log.workspace = true
project.workspace = true
ui.workspace = true
workspace.workspace = true
ggo-asset-formats.workspace = true # GGO
ggo-worldlib.workspace = true # GGO
ggo_common.workspace = true
ggo_sprite_panel.workspace = true
ggo_tileset_panel.workspace = true

[dev-dependencies]
# `project`'s test-support turns on `remote/test-support`, which adds a
# `RemoteConnectionOptions` variant that `remote_connection`'s lib only
# matches on under ITS `test-support` -- same dance `ggo_sprite_panel`'s
# dev-deps document (`remote_connection` enters this crate's test graph
# through `ggo_sprite_panel`).
remote_connection = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
image.workspace = true
path = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
