[package]
name = "ggo_smoke"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ggo_smoke.rs"

[dependencies]

[dev-dependencies]
editor.workspace = true
gpui = { workspace = true, features = ["test-support"] }
ggo_common.workspace = true
# A throwaway database per emulator journey: a run that reaches the end of
# `finish_run` ingests a perf row, and it must not land in the developer's
# real one.
ggo-db.workspace = true
ggo_import_panel = { workspace = true, features = ["test-support"] }
ggo_sprite_panel = { workspace = true, features = ["test-support"] }
ggo_audio_panel = { workspace = true, features = ["test-support"] }
ggo_emerald_panel = { workspace = true, features = ["test-support"] }
ggo_emu_panel = { workspace = true, features = ["test-support"] }
# The paint LIBRARY, not a panel (the standalone map editor is retired).
# Kept here for the world-hosted map journeys, which reach `PaintSession`
# and `MapTool` through the world panel's tab.
ggo_map_panel = { workspace = true, features = ["test-support"] }
ggo_world_panel = { workspace = true, features = ["test-support"] }
ggo_tileset_panel = { workspace = true, features = ["test-support"] }
ggo-worldlib.workspace = true # GGO
image.workspace = true
path = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
# `project`'s test-support turns on `remote/test-support`; `remote_connection`
# only matches the added variant under ITS test-support -- the same dance the
# other ggo panels' dev-deps document.
remote_connection = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
