[package]
name = "ggo_tileset_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
test-support = []

[lib]
path = "src/ggo_tileset_panel.rs"

[dependencies]
anyhow.workspace = true
ggo-asset-formats.workspace = true # GGO
ggo-worldlib.workspace = true # GGO
ggo_common.workspace = true
gpui.workspace = true
log.workspace = true
project.workspace = true
project_panel.workspace = true
serde.workspace = true
serde_json.workspace = true
ui.workspace = true
workspace.workspace = true

[dev-dependencies]
editor = { workspace = true, features = ["test-support"] }
project_panel = { workspace = true, features = ["test-support"] }
# `project`'s test-support turns on `remote/test-support`, which adds a
# `RemoteConnectionOptions` variant that `remote_connection`'s lib only
# matches on under ITS `test-support` -- same dance `ggo_sprite_panel`'s
# dev-deps document.
remote_connection = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
path = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
