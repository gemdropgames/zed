[package]
name = "ggo_reports_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ggo_reports_panel.rs"

[dependencies]
# The three producers write two different timestamp shapes; ordering them
# means parsing both, and the local one needs a zone.
chrono.workspace = true
ggo-worldlib.workspace = true # GGO
ggo_charts_panel.workspace = true # GGO
# GGO -- the one door to GemdropGo: perf runs, device runs and fault dumps
# all arrive over the daemon's socket.
ggo_daemon_client.workspace = true
ggo_common.workspace = true # GGO
gpui.workspace = true
log.workspace = true
# The Reveal entry resolves a report's file to a project entry and emits
# `project::Event::RevealInProjectPanel`, which the project panel answers
# by revealing itself.
project.workspace = true
ui.workspace = true
workspace.workspace = true

[dev-dependencies]
# GGO -- SEEDING ONLY. A journey builds the rows it wants with `TestDb`,
# then reads them back the way the panel does: over the in-process daemon.
ggo-db.workspace = true
ggo_daemon_client = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
